name: AH external recovery tests
on:
  pull_request:
    paths:
      - 'scripts/external_start_recovery.py'
      - '.github/workflows/external-recovery-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile recovery controller
        run: python -m py_compile scripts/external_start_recovery.py
      - name: Run recovery unit tests
        run: python scripts/external_start_recovery.py --self-test
