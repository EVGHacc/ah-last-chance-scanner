name: AH guardian regression tests

on:
  pull_request:
    paths:
      - '.github/workflows/guardian.yml'
      - 'scripts/guardian.py'
      - 'scripts/session.py'
      - 'tests/test_ah_guardian.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/guardian.yml'
      - 'scripts/guardian.py'
      - 'scripts/session.py'
      - 'tests/test_ah_guardian.py'

permissions:
  contents: read

concurrency:
  group: ah-guardian-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardian-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test guardian logic without production credentials
        run: |
          python -m py_compile scripts/guardian.py scripts/session.py
          python scripts/session.py --self-test
          python scripts/guardian.py --self-test
          python -m unittest discover -s tests -p 'test_ah_guardian.py' -v
