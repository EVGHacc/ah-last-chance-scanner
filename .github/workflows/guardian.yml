name: AH independent production guardian

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guardian.yml'
      - 'scripts/guardian.py'
  schedule:
    # Redundant pre-evening starters. Both UTC variants cover CET/CEST.
    # The local-time gate below admits the full 16:55-22:30 Europe/Amsterdam production window.
    - cron: '55 14,15,16 * * *'
    - cron: '5,15,25,35 15,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ah-production-guardian
  cancel-in-progress: false

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate independent guardian start
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          n=datetime.now(ZoneInfo("Europe/Amsterdam"))
          m=n.hour*60+n.minute
          run=(16*60+55 <= m <= 22*60+30)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run={str(run).lower()}\n")
          print("Amsterdam",n.isoformat(),"guardian start admitted",run)
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install auth-state dependency
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --quiet cryptography
      - name: Independent guardian QA
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scanner.py scripts/auth_state.py scripts/persist.py scripts/publish.py scripts/session.py scripts/guardian.py scripts/production_health.py
          python scripts/session.py --self-test
          python scripts/guardian.py --self-test
          python scripts/production_health.py --self-test
          python scripts/production_health.py --preflight
      - name: Guard production output and self-heal
        if: steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: |
          git config user.name ah-guardian-bot
          git config user.email actions@users.noreply.github.com
          python scripts/guardian.py
