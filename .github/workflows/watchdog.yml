name: AH Scanner watchdog

on:
  schedule:
    - cron: '*/5 15-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ah-last-chance-scanner
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Find latest intended scan point and validate persistence
        id: health
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          tz=ZoneInfo('Europe/Amsterdam')
          now=datetime.now(tz)
          start=17*60+30
          end=22*60+30
          raw={m for m in range(start,end+1) if (m-start)%3==0}
          canonical={m for m in range(start,end+1) if (m-start)%5==0}
          due=sorted(raw|canonical)
          minute=now.hour*60+now.minute
          candidates=[m for m in due if m<=minute]
          target=candidates[-1] if candidates else None
          in_window=start <= minute <= end+4
          needs_recovery=False
          reason='outside scan window or before first due point'
          scheduled_at=''

          if in_window and target is not None:
              target_dt=now.replace(hour=target//60,minute=target%60,second=0,microsecond=0)
              age=(now-target_dt).total_seconds()
              slot=f'{target//60:02d}:{target%60:02d}'
              scheduled_at=target_dt.isoformat()
              raw_due=target in raw
              canonical_due=target in canonical
              seen=False
              try:
                  status=json.load(open('data/status.json',encoding='utf-8'))
                  if status.get('date')==now.strftime('%Y-%m-%d'):
                      raw_ok=(not raw_due) or slot in (status.get('rawSeen') or [])
                      canonical_ok=(not canonical_due) or slot in (status.get('canonicalSeen') or [])
                      seen=raw_ok and canonical_ok
              except Exception:
                  seen=False
              if seen:
                  reason=f'{slot} already persisted (raw={raw_due}, canonical={canonical_due})'
              elif 0 <= age <= 240:
                  needs_recovery=True
                  reason=f'{slot} missing; age={age:.0f}s, recovery still within 240s validity budget'
              else:
                  reason=f'{slot} missing but age={age:.0f}s exceeds honest recovery window; not fabricating'

          print(now.isoformat(), 'in_window=',in_window,'needs_recovery=',needs_recovery,reason)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'in_window={str(in_window).lower()}\n')
              f.write(f'needs_recovery={str(needs_recovery).lower()}\n')
              f.write(f'scheduled_at={scheduled_at}\n')
              f.write(f'reason={reason}\n')
          PY

      - name: Recovery scan for exact missing point
        id: recovery
        if: steps.health.outputs.needs_recovery == 'true'
        continue-on-error: true
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
          SCHEDULED_AT: ${{ steps.health.outputs.scheduled_at }}
        run: python scanner.py

      - name: Persist recovery
        if: steps.recovery.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'ah-scanner-watchdog'
          git config user.email 'actions@users.noreply.github.com'
          cp data/latest.json /tmp/latest.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/latest.json data/latest.json
            python scripts/persist.py
            git add data/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "AH watchdog exact recovery $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M')"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Fail if recovery failed
        if: steps.recovery.outcome == 'failure'
        run: |
          echo "Watchdog detected a missing intended scan point and authenticated recovery failed."
          echo "${{ steps.health.outputs.reason }}"
          exit 1
