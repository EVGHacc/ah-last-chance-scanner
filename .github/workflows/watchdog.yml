name: AH Scanner watchdog

on:
  schedule:
    # Two staggered 5-minute schedules give a check every 2-3 minutes while
    # respecting GitHub's minimum 5-minute interval per cron expression.
    - cron: '0-55/5 15-21 * * *'
    - cron: '2-57/5 15-21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ah-last-chance-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile watchdog logic
        run: python -m py_compile scripts/watchdog_targets.py scripts/persist.py scanner.py

      - name: Find every missing intended point still recoverable honestly
        id: health
        shell: bash
        run: |
          python scripts/watchdog_targets.py > /tmp/targets.txt
          echo "targets=$(wc -l < /tmp/targets.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          if [ -s /tmp/targets.txt ]; then
            echo "Recoverable missing points:"
            cat /tmp/targets.txt
          else
            echo "No recoverable missing points."
          fi

      - name: Dispatch authoritative authenticated scanner for missing points
        if: steps.health.outputs.targets != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r scheduled_at; do
            [ -z "$scheduled_at" ] && continue
            echo "Dispatching recovery for $scheduled_at"
            gh workflow run scanner.yml --ref main -f scheduled_at="$scheduled_at"
          done < /tmp/targets.txt
