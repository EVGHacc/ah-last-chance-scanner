name: AH Scanner watchdog

on:
  schedule:
    - cron: '0-55/5 15-21 * * *'
    - cron: '2-57/5 15-21 * * *'
    - cron: '4-59/5 15-21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ah-last-chance-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile watchdog logic
        run: python -m py_compile scripts/watchdog_targets.py

      - name: Check for missing intended points
        id: health
        shell: bash
        run: |
          python scripts/watchdog_targets.py > /tmp/targets.txt
          echo "targets=$(wc -l < /tmp/targets.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          if [ -s /tmp/targets.txt ]; then
            echo "Recoverable missing points detected:"
            cat /tmp/targets.txt
          else
            echo "No recoverable missing points."
          fi

      - name: Mark missing points visibly without consuming AH refresh token
        if: steps.health.outputs.targets != '0'
        shell: bash
        run: |
          echo 'Missing recoverable scanner points detected.'
          echo 'The watchdog is observation-only so a separate job cannot rotate and lose the AH refresh token.'
          echo 'The supervised evening session is the sole automatic AH refresh-token consumer.'
          exit 1
