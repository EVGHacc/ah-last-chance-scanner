name: AH Scanner watchdog

on:
  schedule:
    - cron: '*/5 14-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ah-last-chance-scanner
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate scanner health
        id: health
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz=ZoneInfo('Europe/Amsterdam')
          now=datetime.now(tz)
          minutes=now.hour*60+now.minute
          in_window=17*60+30 <= minutes <= 22*60+30
          unhealthy=False
          reason='outside scan window'
          if in_window:
              try:
                  o=json.load(open('data/latest.json',encoding='utf-8'))
                  checked=datetime.fromisoformat(o['checkedAt']).astimezone(tz)
                  age=(now-checked).total_seconds()/60
                  stores=o.get('stores') or []
                  fetched={int(s['storeId']) for s in stores if s.get('fetched') is True}
                  checks={
                      'fresh': age <= 6,
                      'valid': o.get('valid') is True,
                      'status': o.get('status') in ('OK','OK_ZERO_ROWS'),
                      'auth': o.get('authMode') == 'user-refresh',
                      'stores': fetched == {1463,1348,1135},
                      'vlees': 'Vlees' in (o.get('categories') or []),
                  }
                  unhealthy=not all(checks.values())
                  reason=f"age={age:.1f}m checks={checks}"
              except Exception as exc:
                  unhealthy=True
                  reason=f'latest unreadable/missing: {exc}'
          print(now.isoformat(), 'in_window=',in_window,'unhealthy=',unhealthy,reason)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'in_window={str(in_window).lower()}\n')
              f.write(f'unhealthy={str(unhealthy).lower()}\n')
              f.write(f'reason={reason}\n')
              f.write(f'scheduled_at={now.replace(second=0,microsecond=0).isoformat()}\n')
          PY

      - name: Recovery scan
        id: recovery
        if: steps.health.outputs.in_window == 'true' && steps.health.outputs.unhealthy == 'true'
        continue-on-error: true
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
          SCHEDULED_AT: ${{ steps.health.outputs.scheduled_at }}
        run: python scanner.py

      - name: Persist recovery
        if: steps.recovery.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'ah-scanner-watchdog'
          git config user.email 'actions@users.noreply.github.com'
          cp data/latest.json /tmp/latest.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/latest.json data/latest.json
            python scripts/persist.py
            git add data/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "AH watchdog recovery $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M')"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Fail if recovery failed
        if: steps.recovery.outcome == 'failure'
        run: |
          echo "Watchdog detected unhealthy scanner and authenticated recovery failed."
          exit 1
