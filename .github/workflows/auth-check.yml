name: AH auth check

# Handmatig: test alleen de refresh-token (geen scan, geen publicatie van aanbiedingen).
# Een refresh levert mogelijk een geroteerde token op; die wordt versleuteld bewaard op de
# `data`-branch zodat de secret niet veroudert.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ah-state
  cancel-in-progress: false

jobs:
  auth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Prepare data branch worktree
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add -B data ../state origin/data
          else
            git worktree add --orphan -b data ../state
            [ -f data/auth_state.enc ] && cp data/auth_state.enc ../state/auth_state.enc || true
          fi
      - name: Check refresh token
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: python -m ah_scanner.cli auth-check --state ../state/auth_state.enc --write-state
      - name: Persist rotated state
        if: always()
        working-directory: ../state
        run: |
          set -euo pipefail
          [ -f auth_state.enc ] || exit 0
          git config user.name 'ah-scanner-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add auth_state.enc
          if git diff --cached --quiet; then echo "No state change"; exit 0; fi
          git commit -m 'Update encrypted auth state'
          git push origin HEAD:data
