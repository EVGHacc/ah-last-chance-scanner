name: Vacancy v4 automated match report
# Run-on-push: end-to-end retry requested 2026-10-08; validate provider failures and email credentials.

on:
  schedule:
    # 08:30 Europe/Amsterdam across DST changes; gate below selects local time.
    - cron: '30 6,7 * * 1-5'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider inventory to scan'
        required: true
        type: choice
        options: [ashby, greenhouse, lever, smartrecruiters, eightfold, auditcarriere, personio, breezy]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.provider != ''
    strategy:
      fail-fast: false
      matrix:
        provider: [ashby, greenhouse, lever, smartrecruiters, eightfold, auditcarriere, personio, breezy]
    timeout-minutes: 25
    steps:
      - name: Only run at 08:30 Amsterdam on schedule
        id: localtime
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(TZ=Europe/Amsterdam date +%H)" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.localtime.outputs.run == 'true'
        with:
          ref: vacancy-v4-clean-sheet
      - uses: actions/setup-python@v5
        if: steps.localtime.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Build live provider inventory and matching report
        if: steps.localtime.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || matrix.provider == inputs.provider)
        working-directory: vacancy-v4
        env:
          PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || matrix.provider }}
        run: |
          python - <<'PY'
          import importlib, json, os, pathlib, sys
          provider = os.environ["PROVIDER"]
          module = importlib.import_module(f"app.{provider}_batch")
          result = module.run_batch()
          if result.get("failed") or result.get("verified_complete") != result.get("configured_sources"):
              raise SystemExit("Provider inventory incomplete; no report or email")
          snapshot = pathlib.Path("manual-inventory.json")
          snapshot.write_text(json.dumps(result, ensure_ascii=False), encoding="utf-8")
          PY
          python -m app.manual_report --snapshot manual-inventory.json --output manual-match-report.json
      - name: Upload report for review
        if: steps.localtime.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || matrix.provider == inputs.provider)
        uses: actions/upload-artifact@v4
        with:
          name: vacancy-v4-match-report-${{ matrix.provider }}-${{ github.run_id }}
          path: vacancy-v4/manual-match-report.json
          if-no-files-found: error
          retention-days: 14

  consolidate:
    name: Consolidate provider reports
    needs: [report]
    if: always() && needs.report.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vacancy-v4-match-report-*-${{ github.run_id }}
          path: provider-reports
      - name: Produce combined match report
        run: |
          python - <<'PY'
          import json,pathlib,datetime
          root=pathlib.Path("provider-reports")
          files=list(root.rglob("manual-match-report.json"))
          unique={}
          if not files:
              print("No successful provider reports; zero matches, degraded scan")
          for file in files:
              data=json.loads(file.read_text())
              for match in data.get("matches",[]):
                  key=(match["source"],match["job_id"])
                  unique[key]=match
          output={
              "generated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "provider_reports":len(files),
              "degraded":len(files)<8,
              "unique_matches":len(unique),
              "matches":sorted(unique.values(),key=lambda m:(-m["score"],m["employer"],m["title"])),
              "notification_status":"not_sent",
          }
          pathlib.Path("combined-v4-report.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\n")
          with open(pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]),"a") as out:
              out.write(f"## Vacancy v4 matching\\nProvider reports: {len(files)}/8\\n\\nUnique matches: {len(unique)}\\n\\nEmail: delivery attempted in subsequent step.\\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vacancy-v4-combined-${{ github.run_id }}
          path: combined-v4-report.json
          retention-days: 30

      - name: Email combined report through Resend
        if: github.event_name == 'schedule' || github.event_name == 'push'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_REPORT_TO: ${{ secrets.RESEND_REPORT_TO }}
          RESEND_REPORT_FROM: ${{ secrets.RESEND_REPORT_FROM }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,datetime
          required=("RESEND_API_KEY","RESEND_REPORT_TO","RESEND_REPORT_FROM")
          missing=[key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Email configuration missing: "+", ".join(missing))
          report=json.load(open("combined-v4-report.json"))
          matches=report["matches"]
          lines=[f"Vacancy v4: {len(matches)} matched vacancies from {report['provider_reports']}/8 successful provider reports.", ""]
          for m in matches[:40]:
              lines.append(f"[{m['score']}/10] {m['title']} — {m['employer']} ({m['location']})")
              lines.append(m["url"])
          if len(matches)>40:
              lines.append(f"... and {len(matches)-40} further matches in the GitHub report.")
          lines.append("")
          lines.append("Note: reports from failed providers are excluded; these are not necessarily all vacancies.")
          payload={
              "from":os.environ["RESEND_REPORT_FROM"],
              "to":[os.environ["RESEND_REPORT_TO"]],
              "reply_to":"vacatures@ueveloucri.resend.app",
              "subject":f"Vacancy v4 | {len(matches)} matches | {datetime.date.today().isoformat()}",
              "text":"\\n".join(lines)
          }
          request=urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(payload).encode(),
              headers={"Authorization":"Bearer "+os.environ["RESEND_API_KEY"],"Content-Type":"application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request,timeout=30) as response:
                  body=json.load(response)
                  if response.status not in (200,201) or not body.get("id"):
                      raise SystemExit("Resend did not acknowledge daily digest")
                  print("Resend accepted daily digest; email_id="+body["id"])
          except urllib.error.HTTPError as error:
              details=error.read(4096).decode("utf-8","replace")
              # Resend error body contains validation details, not the authorization header.
              print(f"Resend rejected daily digest (HTTP {error.code}): {details}")
              raise SystemExit(1)
          PY
