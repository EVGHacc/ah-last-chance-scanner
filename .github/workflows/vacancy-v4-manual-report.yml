name: Vacancy v4 automated match report

on:
  schedule:
    # 08:30 Europe/Amsterdam across DST changes; gate below selects local time.
    - cron: '30 6,7 * * 1-5'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider inventory to scan'
        required: true
        type: choice
        options: [ashby, greenhouse, lever, smartrecruiters, eightfold, auditcarriere, personio, breezy]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.provider != ''
    strategy:
      fail-fast: false
      matrix:
        provider: [ashby, greenhouse, lever, smartrecruiters, eightfold, auditcarriere, personio, breezy]
    timeout-minutes: 25
    steps:
      - name: Only run at 08:30 Amsterdam on schedule
        id: localtime
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(TZ=Europe/Amsterdam date +%H)" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.localtime.outputs.run == 'true'
        with:
          ref: vacancy-v4-clean-sheet
      - uses: actions/setup-python@v5
        if: steps.localtime.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Build live provider inventory and matching report
        if: steps.localtime.outputs.run == 'true' && (github.event_name == 'schedule' || matrix.provider == inputs.provider)
        working-directory: vacancy-v4
        env:
          PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || matrix.provider }}
        run: |
          python - <<'PY'
          import importlib, json, os, pathlib, sys
          provider = os.environ["PROVIDER"]
          module = importlib.import_module(f"app.{provider}_batch")
          result = module.run_batch()
          if result.get("failed") or result.get("verified_complete") != result.get("configured_sources"):
              raise SystemExit("Provider inventory incomplete; no report or email")
          snapshot = pathlib.Path("manual-inventory.json")
          snapshot.write_text(json.dumps(result, ensure_ascii=False), encoding="utf-8")
          PY
          python -m app.manual_report --snapshot manual-inventory.json --output manual-match-report.json
      - name: Upload report for review
        if: steps.localtime.outputs.run == 'true' && (github.event_name == 'schedule' || matrix.provider == inputs.provider)
        uses: actions/upload-artifact@v4
        with:
          name: vacancy-v4-match-report-${{ matrix.provider }}-${{ github.run_id }}
          path: vacancy-v4/manual-match-report.json
          if-no-files-found: error
          retention-days: 14

  consolidate:
    name: Consolidate provider reports
    needs: [report]
    if: always() && needs.report.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vacancy-v4-match-report-*-${{ github.run_id }}
          path: provider-reports
      - name: Produce combined match report
        run: |
          python - <<'PY'
          import json,pathlib,datetime
          root=pathlib.Path("provider-reports")
          files=list(root.rglob("manual-match-report.json"))
          unique={}
          for file in files:
              data=json.loads(file.read_text())
              for match in data.get("matches",[]):
                  key=(match["source"],match["job_id"])
                  unique[key]=match
          output={
              "generated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "provider_reports":len(files),
              "unique_matches":len(unique),
              "matches":sorted(unique.values(),key=lambda m:(-m["score"],m["employer"],m["title"])),
              "notification_status":"not_sent",
          }
          pathlib.Path("combined-v4-report.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\\n")
          with open(pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]),"a") as out:
              out.write(f"## Vacancy v4 matching\\nProvider reports: {len(files)}\\n\\nUnique matches: {len(unique)}\\n\\nEmail: not sent (delivery gate not certified).\\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vacancy-v4-combined-${{ github.run_id }}
          path: combined-v4-report.json
          retention-days: 30
