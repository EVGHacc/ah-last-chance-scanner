name: Vacancy v4 provider production proofs

on:
  workflow_dispatch:
  push:
    branches: [vacancy-v4-clean-sheet]
    paths:
      - 'vacancy-v4/app/**'
      - 'vacancy-v4/config/**'
      - 'vacancy-v4/tests/**'
      - '.github/workflows/vacancy-v4-providers.yml'

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        provider: [greenhouse, lever, smartrecruiters, eightfold, auditcarriere]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vacancy-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clean-sheet manifest tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Vacancy match-engine regression gate
        run: python -m unittest discover -s tests/unit -p 'test_matcher.py' -v

      - name: Shared certification and transport tests
        run: |
          python -m unittest discover -s tests/unit -p 'test_certification_registry.py' -v
          python -m unittest discover -s tests/unit -p 'test_proof_acceptance.py' -v
          python -m unittest discover -s tests/unit -p 'test_release_gate.py' -v
          python -m unittest discover -s tests/unit -p 'test_transport.py' -v

      - name: Provider unit and contract tests
        env:
          PROVIDER: ${{ matrix.provider }}
        run: python -m unittest discover -s tests/unit -p "test_${PROVIDER}*.py" -v

      - name: Provider independent QA
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          case "$PROVIDER" in
            greenhouse)
              python -m unittest discover -s tests/qa -p 'test_greenhouse*.py' -v
              python -m unittest discover -s tests/qa -p 'test_transport_resilience.py' -v
              ;;
            lever)
              python -m unittest discover -s tests/qa -p 'test_lever*.py' -v
              python -m unittest discover -s tests/qa -p 'test_transport_resilience.py' -v
              ;;
            smartrecruiters)
              python -m unittest discover -s tests/qa -p 'test_smartrecruiters*.py' -v
              python -m unittest discover -s tests/qa -p 'test_transport_resilience.py' -v
              ;;
            eightfold)
              python -m unittest discover -s tests/unit -p 'test_eightfold*.py' -v
              ;;
            auditcarriere)
              python -m unittest discover -s tests/unit -p 'test_auditcarriere*.py' -v
              python -m unittest discover -s tests/qa -p 'test_transport_resilience.py' -v
              ;;
          esac

      - name: Live provider canary
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          python - <<'PY'
          import importlib,json,os,pathlib,sys,tempfile
          p=os.environ["PROVIDER"]
          m=importlib.import_module(f"app.{p}_batch")
          cfg=pathlib.Path("config")/f"{p}_sources.json"
          data=json.loads(cfg.read_text())
          data["sources"]=data["sources"][:1]
          with tempfile.NamedTemporaryFile("w",suffix=".json",delete=False) as f:
              json.dump(data,f)
              temp=f.name
          r=m.run_batch(config_path=temp)
          print(json.dumps({"provider":p,"canary_verified":r["verified_complete"],"failed":r["failed"]}))
          sys.exit(1 if r["failed"] or r["verified_complete"]!=r["configured_sources"] else 0)
          PY

      - name: Production proof 1
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          python - <<'PY'
          import importlib,json,os,pathlib,sys
          p=os.environ["PROVIDER"]
          m=importlib.import_module(f"app.{p}_batch")
          r=m.run_batch()
          pathlib.Path(f"{p}-proof-1.json").write_text(json.dumps(r,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"provider":p,"proof":1,"verified":r["verified_complete"],"failed":r["failed"]}))
          sys.exit(1 if r["failed"] else 0)
          PY

      - name: Production proof 2
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          python - <<'PY'
          import importlib,json,os,pathlib,sys
          p=os.environ["PROVIDER"]
          m=importlib.import_module(f"app.{p}_batch")
          r=m.run_batch()
          pathlib.Path(f"{p}-proof-2.json").write_text(json.dumps(r,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"provider":p,"proof":2,"verified":r["verified_complete"],"failed":r["failed"]}))
          sys.exit(1 if r["failed"] else 0)
          PY

      - name: Upload immutable proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.provider }}-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            vacancy-v4/${{ matrix.provider }}-proof-1.json
            vacancy-v4/${{ matrix.provider }}-proof-2.json
          if-no-files-found: warn
          retention-days: 90

  promote:
    name: Promote fully green proofs
    needs: [proof]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vacancy-v4-clean-sheet
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download proof pairs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-proofs-${{ github.run_id }}-${{ github.run_attempt }}'
          path: _proof_artifacts
          merge-multiple: true
      - name: Validate, release and persist accepted proofs
        env:
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROOF_CODE_SHA: ${{ github.sha }}
        run: |
          cd vacancy-v4
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          from datetime import datetime,timezone
          from app.proof_acceptance import validate
          from app.release_gate import release_decision
          from app.certification_registry import new_record,accept_green_proof,certified_count

          proof_dir=pathlib.Path("../_proof_artifacts")
          data_dir=pathlib.Path("data")
          ledger_path=data_dir/"certification-ledger.json"
          manifest=json.loads(pathlib.Path("config/sources.json").read_text())
          if manifest.get("target_count")!=105 or len(manifest.get("sources",[]))!=105:
              raise SystemExit("manifest is not exact 105")

          if ledger_path.exists():
              ledger=json.loads(ledger_path.read_text())
              if ledger.get("target_count")!=105:
                  raise SystemExit("invalid existing certification ledger")
              records=ledger["records"]
          else:
              records=[]
              for src in manifest["sources"]:
                  sid=f'{src["kind"]}::{src["name"]}'
                  rec=new_record("",sid)
                  rec.update({"source_id":sid,"kind":src["kind"],"name":src["name"],"provider":None})
                  records.append(rec)

          by_id={r["source_id"]:r for r in records}
          promoted=0
          for p1 in sorted(proof_dir.glob("*-proof-1.json")):
              provider=p1.name.removesuffix("-proof-1.json")
              p2=proof_dir/f"{provider}-proof-2.json"
              if not p2.exists():
                  print(f"{provider}: no complete proof pair; skip promotion")
                  continue
              batch1=validate(p1); batch2=validate(p2)
              if batch1.get("provider")!=provider or batch2.get("provider")!=provider:
                  raise SystemExit(f"{provider}: provider mismatch")
              cfg=pathlib.Path("config")/f"{provider}_sources.json"
              adapter=pathlib.Path("app/providers")/f"{provider}.py"
              authority=pathlib.Path("config/provider_authority.json")
              if not cfg.exists() or not adapter.exists():
                  raise SystemExit(f"{provider}: provenance files missing")
              authority_doc=json.loads(authority.read_text())
              if provider not in authority_doc.get("providers",{}):
                  raise SystemExit(f"{provider}: authority contract missing")
              gates={k:True for k in ("unit_tests","contract_tests","independent_qa","canary","live_proof","authority_contract","persistence_safety")}
              release=release_decision(gates)
              if not release["release_allowed"]:
                  raise SystemExit(f"{provider}: release gate closed")
              adapter_version=subprocess.check_output(["git","rev-parse",f"HEAD:vacancy-v4/{adapter.as_posix()}"],text=True).strip()
              config_hash=hashlib.sha256(cfg.read_bytes()).hexdigest()
              authority_version=f'schema{authority_doc.get("schema_version")}:{hashlib.sha256(authority.read_bytes()).hexdigest()}'
              second={s["name"]:s for s in batch2["sources"]}
              for s1 in batch1["sources"]:
                  name=s1["name"]; s2=second.get(name)
                  if not s2:
                      raise SystemExit(f"{provider}/{name}: missing proof 2 source")
                  matches=[s for s in manifest["sources"] if s["name"]==name]
                  if len(matches)!=1:
                      raise SystemExit(f"{provider}/{name}: source identity ambiguous")
                  src=matches[0]; sid=f'{src["kind"]}::{name}'
                  safe=re.sub(r"[^A-Za-z0-9._-]+","_",sid)
                  date=str(s2["checked_at"])[:10]
                  runbase=f'{os.environ["PROOF_RUN_ID"]}-{os.environ["PROOF_RUN_ATTEMPT"]}'
                  target=data_dir/"accepted"/provider/safe/date/runbase
                  if target.exists():
                      raise SystemExit(f"{provider}/{name}: immutable destination already exists")
                  target.mkdir(parents=True)
                  run_ids=[]
                  for number,source,batch in ((1,s1,batch1),(2,s2,batch2)):
                      run_id=f'{runbase}:{provider}:{sid}:proof-{number}'
                      run_ids.append(run_id)
                      envelope={
                          "schema_version":1,
                          "accepted":True,
                          "release_allowed":True,
                          "release_gates":release,
                          "run_id":run_id,
                          "provider":provider,
                          "source_id":sid,
                          "source":source,
                          "batch_generated_at":batch.get("generated_at"),
                          "workflow_run_id":os.environ["PROOF_RUN_ID"],
                          "workflow_run_attempt":int(os.environ["PROOF_RUN_ATTEMPT"]),
                          "code_commit_sha":os.environ["PROOF_CODE_SHA"],
                          "adapter_version":adapter_version,
                          "config_hash":config_hash,
                          "authority_contract_version":authority_version
                      }
                      (target/f"proof-{number}.json").write_text(json.dumps(envelope,ensure_ascii=False,indent=2)+"\n")
                  rec=by_id[sid]
                  rec["provider"]=provider
                  for number,source in ((1,s1),(2,s2)):
                      proof={
                          "run_id":run_ids[number-1],
                          "accepted_at":source["checked_at"],
                          "adapter_version":adapter_version,
                          "code_commit_sha":os.environ["PROOF_CODE_SHA"],
                          "config_hash":config_hash,
                          "authority_contract_version":authority_version,
                          "unique_jobs":source["unique_jobs"]
                      }
                      rec=accept_green_proof(rec,proof,release_allowed=True)
                  rec.update({"source_id":sid,"kind":src["kind"],"name":name,"provider":provider})
                  by_id[sid]=rec
                  promoted+=1
                  print(f'{provider}/{name}: {rec["certification"]} jobs={rec["certified_job_count"]}')

          ordered=[by_id[f'{s["kind"]}::{s["name"]}'] for s in manifest["sources"]]
          ledger={
              "schema_version":1,
              "target_count":105,
              "certified_coverage":certified_count(ordered),
              "updated_at":datetime.now(timezone.utc).isoformat(),
              "records":ordered
          }
          ledger_path.parent.mkdir(parents=True,exist_ok=True)
          ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"promoted_sources":promoted,"certified_coverage":ledger["certified_coverage"],"target":105}))
          PY
      - name: Commit accepted evidence and ledger
        run: |
          set -euo pipefail
          git config user.name "vacancy-v4-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add -- vacancy-v4/data/accepted vacancy-v4/data/certification-ledger.json
          if git diff --cached --quiet; then
            echo "No new accepted proofs"
          else
            git commit -m "v4: persist accepted provider proofs and certification ledger"
            git push origin HEAD:vacancy-v4-clean-sheet
          fi
