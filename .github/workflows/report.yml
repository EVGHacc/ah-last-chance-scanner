name: AH report

# Weekrapport met trends (alle data, v1 en v2). Gestart door de Worker elke zondag 23:15
# Amsterdam, of handmatig. Schrijft reports/<week>.md naar de data-branch en mailt het rapport.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ah-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Prepare data branch worktree
        run: |
          set -euo pipefail
          git fetch origin data
          git worktree add -B data ../state origin/data
      - name: Build and mail report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AH_MAIL_FROM: ${{ secrets.AH_MAIL_FROM }}
          AH_MAIL_TO: ${{ secrets.AH_MAIL_TO }}
        run: python -m ah_scanner.cli report --data-root ../state --out ../state/reports --mail
      - name: Persist report
        if: always()
        working-directory: ../state
        run: |
          set -euo pipefail
          git config user.name 'ah-scanner-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports
          if git diff --cached --quiet; then echo "No report change"; exit 0; fi
          git commit -m "weekly report"
          for attempt in 1 2 3; do
            git push origin HEAD:data && exit 0
            git pull --rebase origin data
          done
          exit 1
