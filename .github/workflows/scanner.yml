name: AH Laatste Kans scanner

on:
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: 'ISO timestamp of the intended raw scan trigger'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ah-last-chance-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Skip point already persisted successfully
        id: guard
        shell: bash
        env:
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          target=datetime.fromisoformat(os.environ['SCHEDULED_AT'].replace('Z','+00:00')).astimezone(ZoneInfo('Europe/Amsterdam'))
          minute=target.hour*60+target.minute
          start=17*60+30; end=22*60+30
          raw=start<=minute<=end and (minute-start)%3==0
          canonical=start<=minute<=end and (minute-start)%5==0
          slot=target.strftime('%H:%M')
          seen=False
          try:
              s=json.loads(Path('data/status.json').read_text(encoding='utf-8'))
              if s.get('date')==target.strftime('%Y-%m-%d'):
                  seen=((not raw or slot in (s.get('rawSeen') or [])) and
                        (not canonical or slot in (s.get('canonicalSeen') or [])))
          except Exception:
              pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'skip={str(seen).lower()}\n')
          print(target.isoformat(), 'raw=',raw,'canonical=',canonical,'already_seen=',seen)
          PY

      - name: Scan all three stores
        id: scan
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: python scanner.py

      - name: Persist valid measurement and rebuild canonical 5-minute series
        if: steps.scan.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'ah-scanner-bot'
          git config user.email 'actions@users.noreply.github.com'
          cp data/latest.json /tmp/latest.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/latest.json data/latest.json
            python scripts/persist.py
            git add data/
            if git diff --cached --quiet; then
              echo 'No data changes to commit'
              exit 0
            fi
            git commit -m "AH scan $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M')"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt ${attempt}; retrying"
          done
          echo 'Could not persist measurement after 3 attempts'
          exit 1

      - name: Fail workflow when scan failed
        if: steps.scan.outcome == 'failure'
        run: |
          echo 'Authenticated AH scan failed; invalid measurements are not persisted.'
          exit 1
