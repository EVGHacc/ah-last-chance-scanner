name: AH Laatste Kans scanner

on:
  schedule:
    - cron: '*/5 15-20 * * *'
    - cron: '2-57/5 15-20 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scanner.yml'
      - 'scanner.py'

permissions:
  contents: write

concurrency:
  group: ah-last-chance-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Amsterdam scan window
        id: window
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          n = datetime.now(ZoneInfo('Europe/Amsterdam'))
          m = n.hour * 60 + n.minute
          ok = 17 * 60 + 30 <= m <= 22 * 60 + 30
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run={str(ok).lower()}\n')
          print(n.isoformat(), 'scan=', ok)
          PY

      - name: Scan all three stores
        id: scan
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        continue-on-error: true
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: python scanner.py

      - name: Commit measurement
        if: always() && (steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        shell: bash
        run: |
          git config user.name 'ah-scanner-bot'
          git config user.email 'actions@users.noreply.github.com'

          if [ ! -f data/latest.json ]; then
            echo 'No measurement produced'
            exit 0
          fi

          cp data/latest.json /tmp/latest.json
          DATE=$(python -c "import json; print(json.load(open('/tmp/latest.json'))['date'])")
          python - "$DATE" <<'PY'
          import json, sys
          date=sys.argv[1]
          obs=json.load(open('/tmp/latest.json'))
          with open('/tmp/observation.jsonl','w') as f:
              f.write(json.dumps(obs,ensure_ascii=False)+'\n')
          PY

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cat /tmp/observation.jsonl >> "data/${DATE}.jsonl"
            cp /tmp/latest.json data/latest.json
            git add data/
            if git diff --cached --quiet; then
              echo 'No data changes to commit'
              exit 0
            fi
            git commit -m "AH scan $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M')"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying on latest main"
          done
          echo 'Could not persist measurement after 3 attempts'
          exit 1

      - name: Fail workflow when scan failed
        if: always() && steps.scan.outcome == 'failure'
        run: |
          echo 'Scanner returned an incomplete/failed measurement. See data/latest.json and job log.'
          exit 1
