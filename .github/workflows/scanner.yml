name: AH Laatste Kans scanner
on:
  schedule:
    - cron: '*/5 15-20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ah-last-chance-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Amsterdam scan window
        id: window
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          n=datetime.now(ZoneInfo('Europe/Amsterdam'))
          m=n.hour*60+n.minute
          ok=17*60+30 <= m <= 22*60+30
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'run={str(ok).lower()}\n')
          print(n.isoformat(), 'scan=',ok)
          PY
      - name: Scan all three stores
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python scanner.py
      - name: Commit measurement
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'ah-scanner-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "AH scan $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M')"
          git push
