name: Independent AH Production Verifier

on:
  workflow_run:
    workflows:
      - 'AH supervised evening session'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ah:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.name == 'AH supervised evening session')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published AH evidence independently
        run: |
          python scripts/independent_qa.py --self-test
          python scripts/production_verify.py
