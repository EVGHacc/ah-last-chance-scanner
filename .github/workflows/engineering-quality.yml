name: Engineering Quality Gate

# Slanke v2-gate. De jobnamen (changes, policy, ah-tests, independent-review) blijven gelijk,
# zodat eventuele verplichte checks in branch protection blijven kloppen.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'worker/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ah: ${{ steps.scope.outputs.ah }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine affected code
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE_SHA', '')
          head = os.environ['HEAD_SHA']
          if not base or set(base) == {'0'}:
              ah = True
          else:
              files = subprocess.check_output(['git', 'diff', '--name-only', base + '...' + head], text=True).splitlines()
              ah = any(p.startswith(('src/', 'tests/', 'worker/', '.github/workflows/')) or p == 'pyproject.toml' for p in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"ah={str(ah).lower()}\n")
          PY

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test workflow contracts
        run: python -m unittest discover -s tests -p 'test_workflow_*.py' -v
      - name: Static control-plane review
        run: python -m ah_scanner.policy --static-review
        env:
          PYTHONPATH: src
      - name: Enforce code-to-test change policy
        if: github.event_name != 'workflow_dispatch'
        env:
          PYTHONPATH: src
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m ah_scanner.policy --base "$BASE_SHA" --head "$HEAD_SHA"

  ah-tests:
    needs: changes
    if: needs.changes.outputs.ah == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check src tests/unit
      - run: ruff format --check src tests/unit
      - run: pytest --cov=ah_scanner --cov-fail-under=85
      - run: node --test
        working-directory: worker

  independent-review:
    needs: [changes, policy, ah-tests]
    if: ${{ always() && needs.policy.result == 'success' && (needs.ah-tests.result == 'success' || needs.ah-tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent read-only review
        run: |
          python -m ah_scanner.policy --static-review
          python -m unittest discover -s tests -p 'test_workflow_*.py' -v
        env:
          PYTHONPATH: src
      - name: Reviewer has no write scope
        run: echo "Independent reviewer has contents read only and receives no production secrets."
