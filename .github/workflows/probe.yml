name: AH Scanner live probe

on:
  workflow_dispatch:
  schedule:
    - cron: '18 10 * * *'
    - cron: '18 11 * * *'
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'probe.py'
      - 'scripts/persist.py'
      - 'scripts/publish.py'
      - 'scripts/session.py'
      - 'scripts/selftest.py'
      - 'scripts/watchdog_targets.py'
      - '.github/workflows/probe.yml'
      - '.github/workflows/scanner.yml'
      - '.github/workflows/session.yml'
      - '.github/workflows/watchdog.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Gate scheduled probe to correct Amsterdam occurrence
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Amsterdam'))
          offset_hours=int(now.utcoffset().total_seconds()//3600)
          expected=f'18 {12-offset_hours} * * *'
          actual=os.environ.get('EVENT_SCHEDULE','')
          run=actual==expected
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'run={str(run).lower()}\n')
          print('Amsterdam offset=',offset_hours,'expected=',expected,'actual=',actual,'run=',run)
          PY

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Compile scanner stack
        if: steps.gate.outputs.run == 'true'
        run: python -m py_compile scanner.py probe.py scripts/persist.py scripts/publish.py scripts/session.py scripts/selftest.py scripts/watchdog_targets.py

      - name: Test cadence, persistence, session and watchdog invariants
        if: steps.gate.outputs.run == 'true'
        run: python scripts/selftest.py

      # Temporary push execution is enabled only for this verification commit.
      # The next commit restores the normal manual-only live probe condition.
      - name: Live authenticated AH probe
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: python probe.py
