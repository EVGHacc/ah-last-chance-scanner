name: AH Scanner live probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'probe.py'
      - 'scripts/persist.py'
      - 'scripts/publish.py'
      - 'scripts/session.py'
      - 'scripts/selftest.py'
      - 'scripts/watchdog_targets.py'
      - '.github/workflows/probe.yml'
      - '.github/workflows/scanner.yml'
      - '.github/workflows/session.yml'
      - '.github/workflows/watchdog.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile scanner stack
        run: python -m py_compile scanner.py probe.py scripts/persist.py scripts/publish.py scripts/session.py scripts/selftest.py scripts/watchdog_targets.py

      - name: Test cadence, persistence, session and watchdog invariants
        run: python scripts/selftest.py

      - name: Live authenticated AH probe
        if: github.event_name == 'workflow_dispatch'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: python probe.py
