name: AH Scanner live probe

on:
  workflow_dispatch:
  schedule:
    - cron: '18,28,38,48 10 * * *'
    - cron: '18,28,38,48 11 * * *'
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'probe.py'
      - 'scripts/**'
      - '.github/workflows/probe.yml'
      - '.github/workflows/session.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Gate scheduled probe to Amsterdam midday
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Amsterdam'))
          expected=f"18,28,38,48 {12-int(now.utcoffset().total_seconds()//3600)} * * *"
          run=os.environ.get('EVENT_SCHEDULE','')==expected and now.hour==12
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'run={str(run).lower()}\n')
          print('Amsterdam=',now.isoformat(),'expected=',expected,'run=',run)
          PY
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install auth-state dependency
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --quiet cryptography
      - name: Test code and data continuity
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scanner.py probe.py scripts/*.py
          python scripts/auth_state.py
          python scripts/selftest.py
          python scripts/central_data_check.py
      - name: Live authenticated AH probe
        if: steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: python probe.py
