name: AH Scanner live probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'probe.py'
      - 'scripts/persist.py'
      - 'scripts/selftest.py'
      - '.github/workflows/probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile scanner code
        run: python -m py_compile scanner.py probe.py scripts/persist.py scripts/selftest.py
      - name: Test cadence and persistence invariants
        run: python scripts/selftest.py
      - name: Live authenticated AH probe
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: python probe.py
