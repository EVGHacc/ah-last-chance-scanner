name: AH Scanner checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'scripts/**'
      - '.github/workflows/probe.yml'
      - '.github/workflows/session.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install auth-state dependency
        run: python -m pip install --disable-pip-version-check --quiet cryptography
      - name: Check production code and data continuity
        run: |
          python -m py_compile scanner.py scripts/*.py
          python scripts/auth_state.py
          python scripts/selftest.py
          python scripts/central_data_check.py
