name: AH Scanner selftest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'probe.py'
      - 'scripts/auth_state.py'
      - 'scripts/recover_ah_auth.py'
      - 'scripts/persist.py'
      - 'scripts/publish.py'
      - 'scripts/session.py'
      - 'scripts/selftest.py'
      - 'scripts/watchdog_targets.py'
      - '.github/workflows/probe.yml'
      - '.github/workflows/scanner.yml'
      - '.github/workflows/session.yml'
      - '.github/workflows/watchdog.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install auth-state crypto dependency
        run: python -m pip install --disable-pip-version-check --quiet cryptography

      - name: Compile scanner stack
        run: python -m py_compile scanner.py probe.py scripts/auth_state.py scripts/recover_ah_auth.py scripts/persist.py scripts/publish.py scripts/session.py scripts/selftest.py scripts/watchdog_targets.py

      - name: Test cadence, persistence, encrypted auth state and watchdog invariants
        run: |
          python scripts/auth_state.py
          python scripts/selftest.py
