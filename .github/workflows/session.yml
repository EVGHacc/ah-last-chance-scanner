name: AH supervised evening session

on:
  schedule:
    - cron: '0,5,10,15,20 15 * * *'
    - cron: '0,5,10,15,20 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ah-last-chance-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Gate delayed starts while evening window remains
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Amsterdam'))
          # GitHub scheduled runs can be delayed or dropped. Multiple UTC triggers
          # provide independent opportunities to start the same supervised session.
          # The concurrency group serializes them; session.py skips completed points.
          expected_hour=17-int(now.utcoffset().total_seconds()//3600)
          schedule=os.environ.get('EVENT_SCHEDULE','')
          run=(17*60 <= now.hour*60+now.minute <= 22*60+20 and
               schedule==f'0,5,10,15,20 {expected_hour} * * *')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'run={str(run).lower()}\n')
          print('Amsterdam=',now.isoformat(),'expected_hour=',expected_hour,'schedule=',schedule,'run=',run)
          PY

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install auth-state dependency
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --quiet cryptography
      - name: Test production stack
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scanner.py scripts/auth_state.py scripts/persist.py scripts/publish.py scripts/session.py scripts/selftest.py
          python scripts/auth_state.py
          python scripts/selftest.py
      - name: Run supervised scan session
        if: steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: |
          git config user.name 'ah-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          python scripts/session.py
