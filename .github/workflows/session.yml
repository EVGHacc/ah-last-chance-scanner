name: AH supervised evening session

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ah-last-chance-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Gate to 17:00 Amsterdam
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Amsterdam'))
          expected=f"0 {17-int(now.utcoffset().total_seconds()//3600)} * * *"
          run=os.environ.get('EVENT_SCHEDULE','')==expected
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'run={str(run).lower()}\n')
          print('Amsterdam=',now.isoformat(),'expected=',expected,'run=',run)
          PY

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install auth-state dependency
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --quiet cryptography
      - name: Test production stack
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scanner.py scripts/auth_state.py scripts/persist.py scripts/publish.py scripts/session.py scripts/selftest.py
          python scripts/auth_state.py
          python scripts/selftest.py
      - name: Run supervised scan session
        if: steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: |
          git config user.name 'ah-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          python scripts/session.py
