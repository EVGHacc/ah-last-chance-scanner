name: AH supervised evening session

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/session.yml'
      - 'scripts/production_kick.txt'
  schedule:
    # Local 16:47/53/59, 17:07/13/19, 18:11/17/23; UTC alternatives for DST.
    # Starting early gives GitHub queue delays headroom; no top-of-hour starts.
    - cron: '47,53,59 14 * * *'
    - cron: '47,53,59 15 * * *'
    - cron: '7,13,19 15 * * *'
    - cron: '7,13,19 16 * * *'
    - cron: '11,17,23 16 * * *'
    - cron: '11,17,23 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ah-last-chance-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate delayed and DST-adjusted starts
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/schedule_gate.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install auth-state dependency
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --quiet cryptography
      - name: Test production stack
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scanner.py scripts/auth_state.py scripts/persist.py scripts/publish.py scripts/session.py scripts/selftest.py scripts/schedule_gate.py scripts/independent_qa.py
          python scripts/schedule_gate.py --self-test
          python scripts/session.py --self-test
          python scripts/independent_qa.py --self-test
          python scripts/auth_state.py
          python scripts/selftest.py
      - name: Run supervised scan session
        if: steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: |
          git config user.name 'ah-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          python scripts/session.py
