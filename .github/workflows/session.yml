name: AH supervised evening session

on:
  schedule:
    # Primary 17:25 and independent 17:28 backup, both DST-aware.
    - cron: '25 15 * * *'
    - cron: '25 16 * * *'
    - cron: '28 15 * * *'
    - cron: '28 16 * * *'
  # One-time, date-bound recovery. The workflow consumes a repository lock before scanning.
  workflow_dispatch:
    inputs:
      recovery_date:
        description: "Must be 2026-11-03"
        required: true
        type: string
      recovery_confirmation:
        description: "Enter RESTORE-AH-2026-11-03 exactly"
        required: true
        type: string

permissions:
  contents: write

# This is the sole production scheduler and publisher. Never cancel a running session.
concurrency:
  group: ah-production-single-writer
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate primary and redundant DST-adjusted prestart
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          EVENT_REF: ${{ github.ref }}
          RECOVERY_DATE: ${{ inputs.recovery_date }}
          RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation }}
        run: python scripts/schedule_gate.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install auth-state dependency
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --quiet cryptography
      - name: Test production stack
        id: production_tests
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scanner.py scripts/auth_state.py scripts/persist.py scripts/publish.py scripts/session.py scripts/selftest.py scripts/schedule_gate.py scripts/prestart.py scripts/independent_qa.py
          python scripts/schedule_gate.py --self-test
          python scripts/session.py --self-test
          python scripts/independent_qa.py --self-test
          python -m unittest discover -s tests -p 'test_ah_prestart.py' -v
          python scripts/auth_state.py
          python scripts/selftest.py
      - name: Consume one-time recovery authorization
        if: steps.gate.outputs.run == 'true' && github.event_name == 'workflow_dispatch'
        env:
          RECOVERY_DATE: ${{ inputs.recovery_date }}
        shell: bash
        run: |
          set -euo pipefail
          lock=".recovery/ah-recovery-${RECOVERY_DATE}.lock"
          if [[ -e "$lock" ]]; then
            echo "::error::One-time recovery authorization was already consumed"
            exit 1
          fi
          mkdir -p .recovery
          printf 'Consumed by run %s at %s\\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$lock"
          git config user.name 'ah-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$lock"
          git commit -m "Consume one-time AH recovery authorization ${RECOVERY_DATE}"
          git push origin HEAD:main
      - name: Validate prestart configuration without live-auth probe
        id: prestart
        if: steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: python scripts/prestart.py
      - name: Run supervised scan session
        id: supervised_scan
        if: steps.gate.outputs.run == 'true' && steps.prestart.outcome == 'success'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: |
          git config user.name 'ah-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          python scripts/session.py
      - name: Enforce supervised session outcome
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            echo "::error::GATE STEP FAILED; scheduled session state is unknown"
            exit 1
          fi
          if [ "${{ steps.gate.outputs.run }}" != "true" ]; then
            echo "Gate declined this invocation outside the monitoring window"
            exit 0
          fi
          if [ "${{ steps.production_tests.outcome }}" != "success" ]; then
            echo "::error::PRODUCTION TESTS DID NOT SUCCEED"
            exit 1
          fi
          if [ "${{ steps.prestart.outcome }}" != "success" ]; then
            echo "::error::PRESTART CONFIGURATION CHECK DID NOT SUCCEED"
            exit 1
          fi
          if [ "${{ steps.supervised_scan.outcome }}" != "success" ]; then
            echo "::error::SUPERVISED SCAN DID NOT SUCCEED"
            exit 1
          fi
          echo "Prestart, supervised session and production tests all succeeded"
