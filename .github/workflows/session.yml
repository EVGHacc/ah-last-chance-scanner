name: AH supervised evening session

on:
  schedule:
    # One entry matches 17:15 Amsterdam in CEST, the other in CET.
    # The gate uses the scheduled cron expression plus today's UTC offset, so a
    # delayed GitHub start cannot accidentally suppress the correct session.
    - cron: '15 15 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ah-last-chance-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Gate scheduled session to the correct Amsterdam occurrence
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Amsterdam'))
          offset_hours=int(now.utcoffset().total_seconds()//3600)
          expected_utc_hour=17-offset_hours
          expected=f'15 {expected_utc_hour} * * *'
          actual=os.environ.get('EVENT_SCHEDULE','')
          run=actual==expected
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'run={str(run).lower()}\n')
          print('Amsterdam offset=',offset_hours,'expected=',expected,'actual=',actual,'run=',run)
          PY

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Compile and test production logic
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scanner.py scripts/persist.py scripts/publish.py scripts/session.py scripts/watchdog_targets.py
          python scripts/selftest.py

      - name: Run supervised scan session
        if: steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: |
          git config user.name 'ah-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          python scripts/session.py
