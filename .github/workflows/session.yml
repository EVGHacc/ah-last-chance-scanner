name: AH supervised evening session

on:
  schedule:
    # One DST-aware 17:25 prestart; duplicate sessions are deliberately avoided.
    - cron: '25 15 * * *'
    - cron: '25 16 * * *'
permissions:
  contents: write

# This is the sole production scheduler and publisher. Never cancel a running session.
concurrency:
  group: ah-production-single-writer
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate DST-adjusted primary prestart
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/schedule_gate.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install auth-state dependency
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --quiet cryptography
      - name: Test production stack
        id: production_tests
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scanner.py scripts/auth_state.py scripts/persist.py scripts/publish.py scripts/session.py scripts/selftest.py scripts/schedule_gate.py scripts/prestart.py scripts/independent_qa.py scripts/production_health.py scripts/guardian.py
          python scripts/schedule_gate.py --self-test
          python scripts/session.py --self-test
          python scripts/production_health.py --preflight
          python scripts/independent_qa.py --self-test
          python -m unittest discover -s tests -p 'test_ah_prestart.py' -v
          python -m unittest discover -s tests -p 'test_ah_session.py' -v
          python scripts/auth_state.py
          python scripts/selftest.py
      - name: Validate prestart configuration without live-auth probe
        id: prestart
        if: steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: python scripts/prestart.py
      - name: Run supervised scan session
        id: supervised_scan
        if: steps.gate.outputs.run == 'true' && steps.prestart.outcome == 'success'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: |
          git config user.name 'ah-session-bot'
          git config user.email 'actions@users.noreply.github.com'
          python scripts/session.py
      - name: Enforce supervised session outcome
        if: always()
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_DECISION: ${{ steps.gate.outputs.decision }}
          GATE_RUN: ${{ steps.gate.outputs.run }}
          TEST_OUTCOME: ${{ steps.production_tests.outcome }}
          PRESTART_OUTCOME: ${{ steps.prestart.outcome }}
          SCAN_OUTCOME: ${{ steps.supervised_scan.outcome }}
        run: |
          set -euo pipefail
          if [[ "$GATE_OUTCOME" != "success" ]]; then
            echo "::error::SCHEDULE GATE FAILED; invocation state is unknown"
            exit 1
          fi
          if [[ "$GATE_DECISION" == "inactive" ]]; then
            echo "::notice::DST alternate schedule is intentionally inactive today; no production work was expected"
            exit 0
          fi
          if [[ "$GATE_DECISION" != "run" || "$GATE_RUN" != "true" ]]; then
            echo "::error::EXPECTED PRESTART MISSED OR INVALID: decision=$GATE_DECISION"
            exit 1
          fi
          if [[ "$TEST_OUTCOME" != "success" ]]; then
            echo "::error::PRODUCTION TESTS DID NOT SUCCEED"
            exit 1
          fi
          if [[ "$PRESTART_OUTCOME" != "success" ]]; then
            echo "::error::PRESTART CONFIGURATION CHECK DID NOT SUCCEED"
            exit 1
          fi
          if [[ "$SCAN_OUTCOME" != "success" ]]; then
            echo "::error::SUPERVISED SCAN DID NOT SUCCEED"
            exit 1
          fi
          echo "Prestart, supervised session and production tests all succeeded"
