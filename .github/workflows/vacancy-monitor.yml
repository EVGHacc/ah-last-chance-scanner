name: Vacancy Monitor 105

on:
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "vacancy-monitor/registry.tsv"
      - "vacancy-monitor/scanner.py"
      - "vacancy-monitor/test_scanner.py"
      - "vacancy-monitor/requirements.txt"
      - ".github/workflows/vacancy-monitor.yml"

permissions:
  contents: write

concurrency:
  group: vacancy-monitor-105
  cancel-in-progress: false

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vacancy-monitor/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scan all 105 organisations
        env:
          VACANCY_TIMEOUT: "10"
          VACANCY_WORKERS: "16"
        run: |
          python -m unittest discover -s vacancy-monitor -p 'test_*.py'
          python vacancy-monitor/scanner.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("vacancy-monitor/data/latest.json")
          if not p.exists():
              raise SystemExit("latest.json missing")
          d=json.loads(p.read_text())
          assert d["schema_version"] >= 4
          assert d["total_expected"] == 105
          assert d["total_classified"] == 105
          assert d["complete"] is True
          assert d.get("qa", {}).get("passed") is True
          bad = [
              (j.get("organisation"), j.get("title"), j.get("url"))
              for j in d.get("live_relevant_jobs", [])
              if not (j.get("apply_live") and j.get("live") and j.get("board_present") and j.get("http_status") == 200)
          ]
          assert not bad, f"live vacancy QA failures: {bad[:5]}"
          print(json.dumps({
            "run_date": d["run_date"],
            "coverage": d["coverage_percent"],
            "successful_control": d["successful_control_percent"],
            "vacancy_coverage": d["vacancy_coverage_counts"],
            "counts": d["counts"],
            "technical_failures": [x["name"] for x in d["technical_failures"]],
            "live_relevant_jobs": len(d["live_relevant_jobs"]),
            "qa": d["qa"]
          }, ensure_ascii=False, indent=2))
          PY
      - name: Persist daily snapshot
        run: |
          set -euo pipefail
          git config user.name "vacancy-monitor-bot"
          git config user.email "actions@users.noreply.github.com"

          # Save only this run's validated outputs before moving to the newest main.
          snapshot_dir="$(mktemp -d)"
          trap 'rm -rf "$snapshot_dir"' EXIT
          cp vacancy-monitor/data/latest.json "$snapshot_dir/latest.json"
          cp vacancy-monitor/data/coverage-summary.json "$snapshot_dir/coverage-summary.json"
          run_date="$(python -c 'import json; print(json.load(open("vacancy-monitor/data/latest.json"))["run_date"])')"
          cp "vacancy-monitor/data/$run_date.json" "$snapshot_dir/$run_date.json"

          # Another run may have pushed a snapshot while this scan was running.
          # Reapply complete JSON files to the fresh tip, never line-merge JSON.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot_dir/latest.json" vacancy-monitor/data/latest.json
            cp "$snapshot_dir/coverage-summary.json" vacancy-monitor/data/coverage-summary.json
            cp "$snapshot_dir/$run_date.json" "vacancy-monitor/data/$run_date.json"
            git add -- vacancy-monitor/data/latest.json vacancy-monitor/data/coverage-summary.json "vacancy-monitor/data/$run_date.json"
            if git diff --cached --quiet; then
              echo "Snapshot already matches origin/main"
              exit 0
            fi
            git commit -m "Vacancy monitor snapshot $run_date"
            if git push origin HEAD:main; then
              echo "Snapshot persisted successfully"
              exit 0
            fi
            echo "Concurrent push detected (attempt $attempt); retrying against latest main"
            sleep "$attempt"
          done
          echo "::error::Snapshot could not be persisted after five attempts"
          exit 1
