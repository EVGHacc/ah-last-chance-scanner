name: CI v2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check src tests/unit
      - run: ruff format --check src tests/unit
      - run: pytest --cov=ah_scanner --cov-fail-under=85
      - run: node --test
        working-directory: worker
