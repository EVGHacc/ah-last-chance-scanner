name: Vacancy Monitor QA

on:
  push:
    paths:
      - "vacancy-monitor/scanner.py"
      - "vacancy-monitor/embedded_inventory.py"
      - "vacancy-monitor/test_scanner.py"
      - "vacancy-monitor/probe_airwallex.py"
      - "vacancy-monitor/probe_visa.py"
      - "vacancy-monitor/probe_n26_revolut.py"
      - "vacancy-monitor/probe_n26_revolut_inventory.py"
      - "vacancy-monitor/probe_wise.py"
      - "vacancy-monitor/requirements.txt"
      - "vacancy-monitor/registry.tsv"
      - ".github/workflows/vacancy-monitor-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unit dependencies
        run: python -m pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"
      - name: Compile scanner and tests
        run: python -m compileall -q vacancy-monitor/scanner.py vacancy-monitor/embedded_inventory.py vacancy-monitor/test_scanner.py
      - name: Run independent regression tests
        run: python -m unittest discover -s vacancy-monitor -p 'test_*.py' -v
      - name: Probe Airwallex official inventory
        run: python vacancy-monitor/probe_airwallex.py
      - name: Probe Visa official Workday vacancy and pagination
        run: python vacancy-monitor/probe_visa.py
      - name: Probe N26 and Revolut official boards
        run: python vacancy-monitor/probe_n26_revolut.py
      - name: Inspect embedded N26 and Revolut inventories and exact apply routes
        run: python vacancy-monitor/probe_n26_revolut_inventory.py
      - name: Probe Wise official board and four direct vacancy URLs
        run: python vacancy-monitor/probe_wise.py
      - name: Verify the six user-reported vacancy IDs in live official indexes
        run: |
          python - <<'PY'
          import sys,requests
          sys.path.insert(0,"vacancy-monitor")
          from embedded_inventory import embedded_inventory
          headers={"User-Agent":"Mozilla/5.0 Chrome/128"}
          cases=(("N26","https://n26.com/en-eu/careers",
                  {"7845376"}),
                 ("Revolut","https://www.revolut.com/careers/",
                  {"42af5ac2-1c89-44ee-b0eb-bad4124ec2ab",
                   "6777d9e3-caf3-48e0-93ef-80e39230b1c7",
                   "34647acd-dc06-4897-a30a-f1cca93abc87",
                   "ffdf2318-a97f-4a71-93ed-bc3e00ea2f12",
                   "158b9187-b51d-4674-9409-510565ca8a3b"}))
          for name,url,required in cases:
              response=requests.get(url,headers=headers,timeout=15)
              response.raise_for_status()
              result=embedded_inventory(name,response.text,response.url)
              assert result is not None, (name,"no official first-party index")
              found={job["embedded_job_id"] for job in result["jobs"]}
              assert required <= found, (name,"missing IDs",required-found)
              if name=="Revolut":assert len(found)==len(result["jobs"]),"duplicate vacancy IDs"
              print(name,"listed",len(found),"advertised",result["official_total"],
                    "complete",result["complete"],"confirmed IDs",sorted(required),flush=True)
          PY
      - name: Check registry and mandatory employers
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path("vacancy-monitor/registry.tsv").open(encoding="utf-8"),delimiter="\t"))
          assert len(rows)==105, f"expected 105, received {len(rows)}"
          kinds={kind:sum(row["kind"]==kind for row in rows) for kind in ("recruiter","employer")}
          assert kinds=={"recruiter":49,"employer":56}, kinds
          identities=[(row["kind"],row["name"]) for row in rows]
          assert len(set(identities))==105, "duplicate organisation type/name pairs"
          required={"State Street","Kroll","Commerzbank","Lloyds Banking Group","Crédit Agricole CIB","Nordea"}
          assert required.issubset({row["name"] for row in rows if row["kind"]=="employer"})
          assert all(row["seed_urls"] and row["official_domain"] for row in rows)
          print("REGISTRY QA PASS: 49 recruiters, 56 employers, 105 unique official sources")
          PY
