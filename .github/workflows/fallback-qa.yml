name: AH three-minute fallback and QA
on:
  schedule:
    - cron: '*/3 15-21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ah-fallback-short
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Gate Amsterdam evening
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          n=datetime.now(ZoneInfo('Europe/Amsterdam'))
          run=(17*60+30<=n.hour*60+n.minute<=22*60+30)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'run={str(run).lower()}\n')
          print('Amsterdam',n.isoformat(),'fallback enabled',run)
          PY
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Recover recent points
        if: steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: |
          python -m pip install --quiet cryptography
          python -m py_compile scanner.py scripts/session.py scripts/persist.py scripts/publish.py
          git config user.name ah-fallback-bot
          git config user.email actions@users.noreply.github.com
          python scripts/session.py --fallback-once
      - name: Independent publication QA
        if: steps.gate.outputs.run == 'true'
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          n=datetime.now(ZoneInfo('Europe/Amsterdam'))
          p=Path('data/status.json')
          s=json.loads(p.read_text()) if p.exists() else {}
          assert s.get('date')==n.strftime('%Y-%m-%d'), 'STALE: no current-day status'
          raw=set(s.get('rawSeen',[])); canonical=set(s.get('canonicalSeen',[]))
          minutes=n.hour*60+n.minute
          due_raw={f'{m//60:02d}:{m%60:02d}' for m in range(1050,min(minutes-4,1350)+1,3)}
          due_can={f'{m//60:02d}:{m%60:02d}' for m in range(1050,min(minutes-4,1350)+1,5)}
          print('RAW',len(raw),'/101 CANONICAL',len(canonical),'/61')
          print('RAW MISSING',sorted(due_raw-raw))
          print('CANONICAL MISSING',sorted(due_can-canonical))
          assert not (due_raw-raw or due_can-canonical), 'INCOMPLETE: overdue measurements'
          PY
