name: AH fallback and QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fallback-qa.yml'
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 15-21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ah-fallback-short
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate Amsterdam evening
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          n=datetime.now(ZoneInfo('Europe/Amsterdam'))
          run=(17*60+30<=n.hour*60+n.minute<=22*60+30)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'run={str(run).lower()}\n')
          print('Amsterdam',n.isoformat(),'fallback enabled',run)
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Recover recent points
        if: steps.gate.outputs.run == 'true'
        env:
          AH_REFRESH_TOKEN: ${{ secrets.AH_REFRESH_TOKEN }}
        run: |
          python -m pip install --quiet cryptography
          python -m py_compile scanner.py scripts/session.py scripts/persist.py scripts/publish.py
          git config user.name ah-fallback-bot
          git config user.email actions@users.noreply.github.com
          python scripts/session.py --fallback-once
      - name: Independent publication QA
        if: steps.gate.outputs.run == 'true'
        run: |
          git fetch origin main
          git reset --hard origin/main
          python scripts/independent_qa.py
